services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omni_arena
      POSTGRES_USER: omni_arena
      POSTGRES_PASSWORD: omni_arena
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_arena -d omni_arena"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - omni_arena_postgres:/var/lib/postgresql/data

volumes:
  omni_arena_postgres:
