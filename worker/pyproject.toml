[project]
name = "omniarena-rating"
version = "0.3.0"
description = "OmniArena Bradley-Terry rating worker (style control + anomaly screen)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["omniarena_rating*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
