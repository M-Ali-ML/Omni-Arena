name: CI

# Pull requests are covered by the `pull_request` event, so pushes only need to
# be built on the default branch — otherwise every PR branch runs twice.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# No job needs a secret. Every suite runs against the deterministic mock
# provider, and the only databases involved are in-memory (pg-mem), so CI works
# unchanged on forks.
env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  node:
    name: Node (typecheck, build, unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      # Build first: `web` imports `@omni-arena/react`, which resolves through
      # the workspace symlink to `packages/react-sdk/dist`, so its declaration
      # files must exist before anything typechecks `web`.
      - name: Build (server, React SDK, web)
        run: npm run build --workspaces

      - name: Typecheck
        run: npm run typecheck --workspaces

      - name: Test server
        run: npm run test --workspace server

      - name: Test React SDK
        run: npm run test --workspace packages/react-sdk

      # Passes with no tests today; here so web-side specs can't land unrun.
      - name: Test web
        run: npm run test --workspace web

  python:
    name: Python (rating worker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The suite is pure Python (see worker/tests/conftest.py, which puts the
      # worker directory on sys.path): no database, no installed package.
      - name: Test rating worker
        run: python -m pytest

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json
            examples/*/package-lock.json

      # No Postgres service and no migrate/seed step: e2e/harness/server.ts boots
      # the real Fastify app on pg-mem, applies the migrations in-process, and
      # inserts the two mock models itself.
      #
      # The harness imports the server directly from source, so the root
      # workspace dependencies (Fastify, pg-mem, tsx) have to be present.
      - name: Install workspace dependencies
        run: npm ci

      - name: Install e2e harness dependencies
        run: npm ci
        working-directory: e2e

      # `e2e/run.mjs` also runs `playwright install chromium`, but the browser's
      # system libraries are only pulled in by `--with-deps`; the later call is
      # then a no-op.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # Installs and builds both example apps, then drives the full arena flow
      # (stream, vote, reveal, continue) against the mock provider.
      - name: Run end-to-end suite
        run: npm run e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore
