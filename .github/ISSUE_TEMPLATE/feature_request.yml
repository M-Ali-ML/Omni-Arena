name: Feature request
description: Suggest a capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: The use case, not the implementation. What are you trying to do today that doesn't work?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Your proposed behaviour, plus any alternatives you considered.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part of the project?
      options:
        - Server / API
        - Protocol adapter (SSE, AG-UI, A2UI, Vercel AI, OpenAI SSE)
        - Model provider
        - Rating worker (Bradley-Terry)
        - React SDK (@omni-arena/react)
        - Web UI / leaderboard
        - Docs or examples
        - Other
    validations:
      required: true
